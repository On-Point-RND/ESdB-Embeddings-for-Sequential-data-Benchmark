run_name: "${method_name}/tests/${oc.env:TASK_NAME,test_all_ckpts}"
common_seed: 0
device: "cuda:0"

runner:
  name: ${runner_name}
  run_type: simple
  seed_keys:
    - "common_seed"
    - "data.loaders.train.random_seed"
    - "data.dataset.split_seed"
  params:
    n_runs: 1
    n_workers: 1

logging:
  file_lvl: info
  cons_lvl: info

trainer:
  metrics_on_train: true
  ckpt_track_metric: epoch
  ckpt_replace: false
  total_iters: null
  total_epochs: 100
  iters_per_epoch: null
  patience: 1
