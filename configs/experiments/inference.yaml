run_name: "${method_name}/tests/${oc.env:TASK_NAME,simple}"
common_seed: 0
device: "cuda:0"

runner:
  name: ${runner_name}
  run_type: simple
  seed_keys: 
    - "common_seed"
    - "data.loaders.train.random_seed"
    - "data.dataset.split_seed"
  params:
    n_runs: 1
    n_workers: 3
  # device_list: ["cuda:0", "cuda:1", "cuda:2"]

logging:
  file_lvl: info
  cons_lvl: info
  
trainer:
  total_iters: 0 
  ckpt_resume: '/home/dev/ESdB-Embeddings-for-Sequential-data-Benchmark/log/taobao/bert4rec/tests/simple(11)/seed_0/ckpt/epoch__0109_-_loss__1.711.ckpt'


data:
  preprocessing:
    bert4rec_pipeline:
      max_seq_len: 1000000

test_data:
  preprocessing:
    bert4rec_pipeline:
      max_seq_len: 1000000

model:
  params:
    max_len: 1024
    query_aggregation: last
    take_emb_before_reconstruction: true