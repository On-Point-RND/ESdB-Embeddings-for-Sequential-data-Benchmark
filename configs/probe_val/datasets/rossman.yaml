global_train_filter: exclude_test
downstream_selection:
  # Entity counts in original eligible splits; null means all.
  train_size: null
  val_size: null
  # Optional overrides: every_n_epochs, patience (in checks).
  task_names:
    - target__clf__global__accuracy+f1_macro
    - target__anomaly__local__roc_auc
    - target__reg_amount__local__r2
    - target__forecast__local__r2
  targets:
    classification: target__clf__global__accuracy+f1_macro
    anomaly: target__anomaly__local__roc_auc
    regression: target__reg_amount__local__r2
    forecasting: target__forecast__local__r2
  # Historical epochs capped at 200; missing cells use 200.
  epoch_limits:
    bert4rec:
      regression: 73
      classification: 100
      forecasting: 100
      anomaly: 100
    jepa:
      regression: 100
      classification: 100
      forecasting: 100
      anomaly: 100
    coles:
      regression: 64
      classification: 51
      forecasting: 86
      anomaly: 86
    SimCLR:
      regression: 200
      classification: 82
      forecasting: 200
      anomaly: 200
    SimCLR_masks:
      regression: 117
      classification: 74
      forecasting: 48
      anomaly: 78
    ntp_gru:
      regression: 71
      classification: 200
      forecasting: 200
      anomaly: 81
    ntp_gpt:
      regression: 200
      classification: 91
      forecasting: 85
      anomaly: 47
