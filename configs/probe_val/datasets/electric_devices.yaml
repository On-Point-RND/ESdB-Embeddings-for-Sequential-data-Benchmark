global_train_filter: exclude_test
downstream_selection:
  # Entity counts in original eligible splits; null means all.
  train_size: 3000
  val_size: null
  # Optional overrides: every_n_epochs, patience (in checks).
  task_names: null  # Only the source best_* task.
  targets:
    forecasting: target__forecast__local__r2
    classification: target__clf__global__accuracy+f1_macro
  # Historical epochs capped at 200; missing cells use 200.
  epoch_limits:
    bert4rec:
      classification: 93
      forecasting: 100
    jepa:
      classification: 100
      forecasting: 100
    coles:
      classification: 50
      forecasting: 107
    SimCLR:
      classification: 69
      forecasting: 200
    SimCLR_masks:
      classification: 76
      forecasting: 182
    ntp_gru:
      classification: 47
      forecasting: 104
    ntp_gpt:
      classification: 129
      forecasting: 107
