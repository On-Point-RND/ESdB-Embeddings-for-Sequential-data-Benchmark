global_train_filter: exclude_test
downstream_selection:
  # Entity counts in original eligible splits; null means all.
  train_size: 5000
  val_size: 2000
  # Optional overrides: every_n_epochs, patience (in checks).
  task_names: null  # Only the source best_* task.
  targets:
    regression: target__reg_amount__local__r2
    classification: target__age__global__accuracy+f1_macro
    forecasting: target__forecast__local__r2
    anomaly: target__anomaly__global__roc_auc
  # JEPA/BERT: 120 epochs; others: historical cap 200, missing cells 200.
  epoch_limits:
    bert4rec:
      regression: 120
      classification: 120
      forecasting: 120
      anomaly: 120
    jepa:
      regression: 120
      classification: 120
      forecasting: 120
      anomaly: 120
    coles:
      regression: 74
      classification: 21
      forecasting: 200
      anomaly: 70
    SimCLR:
      regression: 41
      classification: 92
      forecasting: 41
      anomaly: 32
    SimCLR_masks:
      regression: 64
      classification: 71
      forecasting: 91
      anomaly: 26
    ntp_gru:
      regression: 102
      classification: 23
      forecasting: 173
      anomaly: 23
    ntp_gpt:
      regression: 50
      classification: 36
      forecasting: 31
      anomaly: 78
