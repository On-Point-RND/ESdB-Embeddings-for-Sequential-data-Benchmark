representation_export:
  enabled: true
  extractor: sequential
  primary: embedding
  layer_names:
    - features
    - encoder
    - embedding
  lidar:
    enabled: true
    source: embedding
    groups:
      - name: window_jitter_005
        perturbation: window_jitter
        views: 4
        seed: 42
        params:
          max_drop_fraction: 0.05
          min_drop_events: 0
          min_len: 5
