optimizer:
  params:
    weight_decay: 1.0200530606801927e-08
    lr: 1.63033661201238e-05
model:
  params:
    hidden_size: 384
    num_heads: 4
    query_aggregation: last
    dropout: 0.3
    num_blocks: 5
    num_passes_over_block: 1
    cat_emb_dim: 128
    num_emb_dim: 32
    embedding_size: 1024
    masker:
      params:
        mask_prob: 0.2001453760441734
        span_len: 38
        span_share: 0.55
        random_token_prob: 0.05
        keep_event_prob: 0.1
        partial_cat_feature_prob: 0.5
        partial_num_feature_prob: 0.45
