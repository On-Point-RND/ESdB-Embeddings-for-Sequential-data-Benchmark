    num_emb_dim: 32
    embedding_size: 1024
    masker:
      params:
        mask_prob: 0.6702928855832508
        span_len: 5
        span_share: 0.25
        random_token_prob: 0.0
        keep_event_prob: 0.05
        partial_cat_feature_prob: 0.25
        partial_num_feature_prob: 0.5
