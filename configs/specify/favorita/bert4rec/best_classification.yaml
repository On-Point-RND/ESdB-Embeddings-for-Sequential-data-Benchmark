optimizer:
  params:
    weight_decay: 1.213052158881952e-07
    lr: 0.0002425905585078393
model:
  params:
    hidden_size: 1024
    num_heads: 1
    query_aggregation: mean
    dropout: 0.0
    num_blocks: 3
    num_passes_over_block: 1
