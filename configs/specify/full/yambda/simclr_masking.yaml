data:
  preprocessing:
    contrastive_pipeline:
      batch_transforms:
        AUG_masking:
          AugmentationMasker:
            params:
              mask_prob: 0.25
              span_len: 8
              span_share: 0.6
              random_token_prob: 0.1
              keep_event_prob: 0.1
              partial_cat_feature_prob: 0.1
              partial_num_feature_prob: 0.2
