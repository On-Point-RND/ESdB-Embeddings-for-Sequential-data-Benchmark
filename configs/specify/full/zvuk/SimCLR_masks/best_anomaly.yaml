optimizer:
  params:
    weight_decay: 3.1797231825912585e-10
    lr: 0.00021547048147501133
unsupervised_loss:
  params:
    temperature: 0.09345277776100241
data:
  loaders:
    unsupervised_train:
      batch_size: 256
model:
  encoder:
    params:
      num_layers: 1
      hidden_size: 150
  preprocess:
    params:
      time_process: cat
      num_norm: true
      cat_emb_dim: 6
      num_emb_dim: 28
  aggregation:
    name: TakeLastHidden
