data:
  preprocessing:
    contrastive_pipeline:
      batch_transforms:
        AUG_masking:
          AugmentationMasker:
            params:
              mask_prob: 0.4
              span_len: 8
              span_share: 0.45
              random_token_prob: 0.0
              keep_event_prob: 0.05
              partial_cat_feature_prob: 0.2
              partial_num_feature_prob: 0.2
