method_name: jepa_tail
runner_name: BertRunner

main_loss:
  name: ModelLoss
  params: {}

metrics:
  - name: LoggingMetric
    params: {key: jepa_loss}
  - name: LoggingMetric
    params: {key: jepa_cosine}
  - name: LoggingMetric
    params: {key: mask_ratio}

trainer:
  ckpt_track_metric: loss
  metrics_on_train: true
  patience: ${patience}
  total_iters: 100_000

model:
  name: JEPA
  params:
    cat_cardinalities: ${cc}
    num_features: ${nn}
    time_process: ${model.preprocess.params.time_process}
    cat_emb_dim: 128
    num_emb_dim: 128
    num_norm: false
    ignore_index: -100
    ema_tau: 0.99
    predictor_hidden_multiplier: 1.0
    objectives:
      jepa:
        enabled: true
        weight: 1.0
      mlm:
        enabled: false
        weight: 0.0
      contrastive:
        enabled: false
        weight: 0.0
    masker:
      name: TailMasker
      params:
        mask_prob: 0.2
        random_token_prob: 0.0
        keep_event_prob: 0.0
        num_mask_fill: zero
        partial_cat_feature_prob: 0.0
        partial_num_feature_prob: 0.0
    query_aggregation: last
    downstream_embedding_source: target
    max_len: ${data.preprocessing.common_pipeline.max_seq_len}
    hidden_size: 128
    embedding_size: 128
    num_blocks: 2
    num_heads: 4
    num_passes_over_block: 1
    dropout: 0.1
    enable_positional_embedding: false
  preprocess:
    params:
      time_process: "cat"

optimizer:
  name: Adam
  params:
    lr: 3.e-4
    weight_decay: 1.e-6

optuna:
  params:
    n_trials: 100
    n_startup_trials: 10
    target_metric: ${tasks}
  suggestions:
    optimizer.params.weight_decay: [suggest_float, {low: 1.e-10, high: 1.e-2, log: True}]
    optimizer.params.lr: [suggest_float, {low: 1.e-5, high: 1.e-2, log: True}]

    model.params.hidden_size: [suggest_int, {low: 64, high: 1024, step: 32}]
    model.params.ema_tau: [suggest_categorical, {choices: [0.99, 0.995, 0.998, 0.999]}]
    model.params.predictor_hidden_multiplier: [suggest_categorical, {choices: [0.5, 1.0, 2.0]}]
    model.params.num_heads: [suggest_categorical, {choices: [1, 2, 4, 8]}]
    model.params.query_aggregation: [suggest_categorical, {choices: [last, mean]}]
    model.params.dropout: [suggest_float, {low: 0.0, high: 0.3, step: 0.05}]
    model.params.num_blocks: [suggest_int, {low: 1, high: 5, log: False}]
    model.params.num_passes_over_block: [suggest_int, {low: 1, high: 2, log: False}]
    model.params.cat_emb_dim: [suggest_int, {low: 16, high: 128, step: 16}]
    model.params.num_emb_dim: [suggest_int, {low: 16, high: 128, step: 16}]
    model.params.embedding_size: [suggest_categorical, {choices: [64, 256, 1024]}]

    model.params.masker.params.mask_prob: [suggest_float, {low: 0.1, high: 0.8, log: False}]
