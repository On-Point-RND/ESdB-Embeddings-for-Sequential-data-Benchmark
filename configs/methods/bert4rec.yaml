method_name: bert4rec
runner_name: BertRunner

main_loss:
  name: ModelLoss
  params: {}

metrics: null

trainer:
  ckpt_track_metric: loss
  metrics_on_train: false
  patience: ${patience}
  total_iters: 100_00
  # ckpt_resume: ''

model:
  name: Bert4Rec
  params:
    cat_cardinalities: ${cc}
    num_features: ${nn}
    time_process: ${model.preprocess.params.time_process}
    cat_emb_dim: 128
    num_emb_dim: 128
    num_norm: false
    target_cat_feature: small_group
    reconstruction_mode: true
    reconstruction_ce_weight: 1.0
    reconstruction_mse_weight: 1.0
    ignore_index: -100
    masker:
      name: PointMasker
      params:
        mask_prob: 0.2
        span_len: 10
        span_share: 0.5
        random_token_prob: 0.1  # How many masked tokens going to be corrupted not masked
        keep_event_prob: 0.0  # Keep selected events unchanged for both cat and num
        num_mask_fill: zero
        partial_cat_feature_prob: 0.0
        partial_num_feature_prob: 0.0
    query_aggregation: last
    max_len: ${data.preprocessing.bert4rec_pipeline.max_seq_len}
    hidden_size: 128
    num_blocks: 2
    num_heads: 4
    num_passes_over_block: 1
    dropout: 0.1
    enable_positional_embedding: true
  preprocess:
    params:
      time_process: "diff"

data:
  loaders:
    train:
      preprocessing: bert4rec_pipeline
    full_train:
      preprocessing: bert4rec_pipeline
    train_val:
      preprocessing: bert4rec_pipeline
    hpo_val:
      preprocessing: bert4rec_pipeline

test_data:
  loaders:
    test:
      preprocessing: bert4rec_pipeline

optimizer:
  name: Adam
  params:
    lr: 1.e-3
    weight_decay: 1.e-6
