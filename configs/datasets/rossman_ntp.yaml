log_dir: log/rossman
patience: 10
n_classes: 7
main_metric: MulticlassAUROC
main_loss: 
  name: nn.CrossEntropyLoss

cc: 
  DayOfWeek: 7
  Open: 2
  Promo: 2
  StateHoliday: 2
  SchoolHoliday: 2
ee:
nn:
  - Sales
  - Customers
data:
  dataset:
    parquet_path: "data/rossman/preprocessed_ntp/train"
    random_split: true
    split_seed: 42

    split_sizes: 
      - 0.85   # train
      - 0.15  # train_val
      - 0.0  # hpo_val

  preprocessing:
    common_pipeline: &common_pipeline
      max_seq_len: 1000
      time_name: Date
      index_name: Store
      target_name: DayOfWeek
      num_names: ${nn}
      cat_cardinalities: ${cc}
      batch_transforms:
        - DatetimeToFloat:
            loc: "2013-01-01"
            scale: [30, "D"]
        - TimeToFeatures:
            process_type: ${model.preprocess.params.time_process}
        - MaskValid
    contrastive_pipeline:
      <<: *common_pipeline
      batch_transforms:
        - DatetimeToFloat:
            loc: "2013-01-01"
            scale: [30, "D"]
        - TimeToFeatures:
            process_type: ${model.preprocess.params.time_process}
        - MaskValid
        - ContrastiveTarget
        - RandomSlices:
            split_count: 5
            cnt_min: 30
            cnt_max: 90
            short_seq_crop_rate: 0.8
            seed: 0
    primenet_pipeline:
      <<: *common_pipeline
      batch_transforms:
        - DatetimeToFloat:
            loc: "2013-01-01"
            scale: [30, "D"]
        - TimeToFeatures:
            process_type: ${model.preprocess.params.time_process}
        - MaskValid
        - PrimeNetSampler:
            segment_num: 3

  loaders:
    train:
      split_idx: 0
      preprocessing: common_pipeline
      batch_size: 128
      drop_incomplete: true
      shuffle: true
      loop: false
      num_workers: 4
      random_seed: 42
    full_train:
      split_idx: 0
      preprocessing: common_pipeline
      batch_size: 128
      num_workers: 4
    train_val:
      split_idx: 1
      preprocessing: common_pipeline
      batch_size: 128
      num_workers: 4
    hpo_val:
      split_idx: 2
      preprocessing: common_pipeline
      batch_size: 128
      num_workers: 4

test_data:
  dataset:
    parquet_path: "data/rossman/preprocessed_ntp/test"
    split_sizes: 
      - 1.0
  preprocessing:
    common_pipeline: *common_pipeline
  loaders:
    test:
      split_idx: 0
      preprocessing: common_pipeline
      batch_size: 128
      num_workers: 4

metrics:
  - name: ${main_metric}
    params: 
      num_classes: ${n_classes}
