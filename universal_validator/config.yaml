config_factory: [datasets/age]
seed: 0
verbose: True
task_names: 
  - target__forecast__local__roc_auc
  - target__reg_amount__local__mse
  - target__forecast__local__mse

hpo:
  enabled: False
  n_trials: 10
  cv: 3
  n_jobs: 4
  max_threads: 4
  show_progress_bar: True # show progess bar

models:
  mlp:
    classifier: sklearn.neural_network.MLPClassifier
    regressor: sklearn.neural_network.MLPRegressor
    shared_params:
      hidden_layer_sizes: [100, 50]
      random_state: 42
      max_iter: 1000
      early_stopping: true
      validation_fraction: 0.1
      verbose: false
    search_space:
      hidden_layer_sizes: [[64], [128], [256], [64,32], [128,64]]
      alpha: { low: 0.0001, high: 0.1, log: true }
      learning_rate_init: { low: 0.001, high: 0.1, log: true }
      batch_size: [32, 64, 128, 256]
      activation: [relu, tanh]
    task_specific:

  lgbm:
    classifier: lightgbm.LGBMClassifier
    regressor: lightgbm.LGBMRegressor
    shared_params:
      n_estimators: 100
      random_state: 42
      verbose: -1
      n_jobs: 1

