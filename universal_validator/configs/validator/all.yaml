config_factory: [datasets/age]
seed: 0
verbose: False

hpo:
  enabled: False
  n_trials: 100
  cv: 3
  n_jobs: 4
  max_threads: 4
  show_progress_bar: True # show progess bar

models:
  

  mlp_torch:
    classifier: universal_validator.models.torch_mlp.TorchMLPClassifier
    regressor: universal_validator.models.torch_mlp.TorchMLPRegressor
    shared_params:
      hidden_layer_sizes: [256, 128]
      random_state: 42
      max_epoch: 1000
      early_stopping: true
      validation_fraction: 0.1
      verbose: false
      device: cuda:0
      batch_size: 512
      num_workers: 4
      learning_rate_init: 3e-4
      weight_decay: 2.e-06
    search_space:
      weight_decay: { low: 1e-6, high: 1e-2, log: true }
      learning_rate_init: { low: 1e-4, high: 1e-2, log: true }
      batch_size: [128, 256, 512, 1024]
    task_specific:


  logreg_torch:
    classifier: universal_validator.models.torch_mlp.TorchMLPClassifier
    regressor: universal_validator.models.torch_mlp.TorchMLPRegressor
    shared_params:
      hidden_layer_sizes: []
      random_state: 42
      max_epoch: 200
      early_stopping: true
      validation_fraction: 0.1
      verbose: false
      device: cuda:0
      batch_size: 512
      num_workers: 4
      learning_rate_init: 3e-4
      weight_decay: 2.e-06
    search_space:
      weight_decay: { low: 1e-6, high: 1e-2, log: true }
      learning_rate_init: { low: 1e-4, high: 1e-2, log: true }
      batch_size: [128, 256, 512, 1024]
    task_specific:

  lgbm:
    classifier: lightgbm.LGBMClassifier
    regressor: lightgbm.LGBMRegressor
    shared_params:
      n_estimators: 1000
      boosting_type: gbdt
      learning_rate: 0.02
      subsample: 0.75
      subsample_freq: 1
      colsample_bytree: 0.75
      max_depth: 12
      reg_alpha: 1
      reg_lambda: 1
      min_child_samples: 50
      num_leaves: 50
      random_state: 42
      n_jobs: 8

    search_space:
      n_estimators: { low: 100, high: 1000 }
      max_depth: { low: 3, high: 12 }
      num_leaves: { low: 10, high: 200 }
      learning_rate: { low: 0.001, high: 0.3, log: true }
      subsample: { low: 0.6, high: 1.0 }
      colsample_bytree: { low: 0.6, high: 1.0 }
      reg_alpha: { low: 1e-8, high: 10.0, log: true }
      reg_lambda: { low: 1e-8, high: 10.0, log: true }
      min_child_samples: { low: 5, high: 100 }
    task_specific:
      anomaly_detection:
        is_unbalance: true
